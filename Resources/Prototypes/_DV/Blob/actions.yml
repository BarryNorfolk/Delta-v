- type: entity
  parent: BaseAction
  id: ActionBlobCreateNode
  name: Create Node
  description: Spread your network and create a new node
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi # TODO(Barry): Icons
      state: siphon
  - type: TargetAction
    range: -1
  - type: WorldTargetAction
    event: !type:EventBlobCreateNode {}
  - type: ActionCost
    cost: 1 # TODO (Barry): Actually put this to a number after we're finished testing

- type: entity
  parent: BaseAction
  id: ActionBlobUpgradeNode
  name: Upgrade Node
  description: Upgrade a node in your network
  components:
  - type: Action
    useDelay: 0
    itemIconStyle: NoItem
    icon:
      sprite: _DV/CosmicCult/Icons/cosmiccult_abilities.rsi # TODO(Barry): Icons
      state: siphon
  - type: TargetAction
    range: -1
    checkCanAccess: false
  - type: EntityTargetAction
    event: !type:EventBlobUpgradeNode {}
    canTargetSelf: false
    whitelist:
      components:
      - BlobNode

