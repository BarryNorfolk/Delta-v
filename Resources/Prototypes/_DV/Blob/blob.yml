# The base for any node in the Blob's network
- type: entity
  id: BlobNodeBase
  parent: BaseStructure
  abstract: true
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: BlobNode
  - type: UserInterface
    interfaces:
      enum.BlobUiKey.Key:
        type: BlobUpgradeInterface
  - type: Sprite
    sprite: _DV/Mobs/Blob/blob.rsi
    layers:
    - state: regular
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Damageable
    damageModifierSet: Blob
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak # TODO(Barry): A better sound here
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak # TODO(Barry): A better sound here
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: InteractionOutline
  - type: Examiner
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg" # TODO(Barry): Sounds and Damage
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 10
        Piercing: 10
  - type: NodeContainer
    nodes:
      blob: !type:BlobNode
        nodeGroupID: Blob
        needAnchored: false

# A regular node on the blob network
- type: entity
  id: BlobNode
  name: Blob Node
  description: A part of the blob, it looks eerily comfy...
  parent: BlobNodeBase
  categories: [ DoNotMap ]
  components:
  - type: BlobSimpleNode

# A node on the network that generates resources
- type: entity
  id: BlobResourceNode
  name: Blob Resource Node
  description: A hardworking, white collar resource node...
  parent: BlobNodeBase
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    sprite: _DV/Mobs/Blob/blob.rsi
    layers:
    - state: special_base
    - state: resource
  - type: BlobPulseReceiver
  - type: BlobResourceProducer

# The core node that will house the overmind/player
- type: entity
  id: BlobCore
  parent: BlobNodeBase
  name: Blob Core
  description: The core of the blob, it pulstates with the power of a thousand moons...
  categories: [ DoNotMap ]
  components:
  - type: Blob
  - type: Sprite
    sprite: _DV/Mobs/Blob/blob.rsi
    layers:
    - state: special_base
    - state: core
  - type: Actions
  - type: Eye
    drawFov: false
  - type: Examiner
  - type: InputMover
  - type: BlockMovement
    blockInteraction: false
  - type: StartingMindRole
    mindRole: "MindRoleBlob"
    silent: true

# Projection that the overmind can use to move around with
- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: BlobOvermindEye
  name: Blob Overmind
  description: The eye of the Blob
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: NoFTL
  - type: Tag
    tags:
    - GhostOnlyWarp
  - type: WarpPoint
    follow: true
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Eye
    pvsScale: 1.5
  - type: Visibility
    layer: 2
  - type: Sprite
    sprite: _DV/Mobs/Blob/blob.rsi
    layers:
    - state: overmind
      shader: unshaded
      map: ["base"]
