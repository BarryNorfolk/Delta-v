- type: entity
  parent: BasePDA
  id: BlueShieldPDA
  name: blueshield officer's PDA
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Pda
    id: BlueShieldIDCard
    state: pda-blueshield
  - type: Icon
    sprite: _Starlight/Objects/Devices/pda.rsi
    state: pda-blueshield
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - MedTekCartridge
